services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_interview_postgres_dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arion}
      POSTGRES_USER: ${POSTGRES_USER:-arion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arion_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ai_interview_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    image: node:24
    container_name: ai_interview_backend_dev
    working_dir: /app
    # Ánh xạ toàn bộ thư mục code thật vào trong Container
    volumes:
      - ./ai-interview-backend:/app
      # Giữ lại node_modules trong container để không xung đột với máy thật
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-arion}:${POSTGRES_PASSWORD:-arion_password}@postgres:5432/${POSTGRES_DB:-arion}?schema=public
    command: sh -c "npm install && npx prisma generate && npx prisma migrate deploy && npm run start:dev"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./ai-interview-backend/.env

  frontend:
    image: node:24-alpine
    container_name: ai_interview_frontend_dev
    working_dir: /app
    # Ánh xạ toàn bộ thư mục code thật vào trong Container
    volumes:
      - ./ai-interview-frontend:/app
      - /app/node_modules
    ports:
      - "3001:3001"
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    depends_on:
      - backend

volumes:
  postgres_dev_data:
  redis_data:
