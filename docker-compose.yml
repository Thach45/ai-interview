services:
  # --- 1. REDIS ---
  redis:
    image: redis:7-alpine
    container_name: ai_interview_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # --- 2. BACKEND ---
  backend:
    build:
      context: ./ai-interview-backend
      dockerfile: Dockerfile
    container_name: ai_interview_backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped
    # Đọc thêm các biến môi trường khác từ file .env của backend (nếu có)
    env_file:
      - ./ai-interview-backend/.env


volumes:
  redis_data:
