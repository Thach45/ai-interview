services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_interview_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arion}
      POSTGRES_USER: ${POSTGRES_USER:-arion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arion_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ai_interview_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build:
      context: ./ai-interview-backend
      dockerfile: Dockerfile
    container_name: ai_interview_backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-arion}:${POSTGRES_PASSWORD:-arion_password}@postgres:5432/${POSTGRES_DB:-arion}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    # Đọc thêm các biến môi trường khác từ file .env của backend (nếu có)
    env_file:
      - ./ai-interview-backend/.env


volumes:
  postgres_data:
  redis_data:
