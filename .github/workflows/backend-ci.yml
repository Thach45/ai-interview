name: Backend CI

on:
  push:
    paths:
      - "ai-interview-backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "ai-interview-backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-interview-backend

    env:
      DATABASE_URL: mongodb://localhost:27017/arion_ci
      PUPPETEER_SKIP_DOWNLOAD: "true"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ai-interview-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build NestJS
        run: npm run build